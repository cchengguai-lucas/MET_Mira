[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "met-jira"
version = "0.1.0"
description = "MET intranet issue tracking and collaboration platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "apscheduler>=3.10,<4",
  "ldap3>=2.9.1",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "pillow>=10",
  "prometheus-client>=0.21",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["."]
markers = ["postgres: requires METJIRA_TEST_POSTGRES_URL"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Chinese prompt / header literals are wider than they look.
"backend/services/agent.py" = ["E501"]
"backend/services/agent_tools.py" = ["E501"]
"backend/services/jql_assist.py" = ["E501"]
"backend/services/excel_io.py" = ["E501"]
"backend/migrations/*" = ["E501", "I001", "UP"]
